name: Push Alpaca Financial News to Discord

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes
  workflow_dispatch:

jobs:
  fetch-alpaca-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to sync state files to the background branch

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Restore State from Background Branch
        run: |
          git fetch origin state-data || true
          git checkout origin/state-data -- seen_alpaca_news.json 2>/dev/null || true
          git reset # Unstage files so git status stays clean for the script

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests discord-webhook

      - name: Run Alpaca News Poller & Notifier
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
        run: |
          python - <<EOF
          import os
          import json
          import requests
          from discord_webhook import DiscordWebhook, DiscordEmbed

          STATE_FILE = "seen_alpaca_news.json"
          webhook_url = os.environ.get("DISCORD_WEBHOOK_NEWS")
          api_key = os.environ.get("APCA_API_KEY_ID")
          api_secret = os.environ.get("APCA_API_SECRET_KEY")

          if not webhook_url or not api_key or not api_secret:
              print("❌ Error: Missing required environment secrets.")
              exit(1)

          headers = {
              "APCA-API-KEY-ID": api_key,
              "APCA-API-SECRET-KEY": api_secret
          }

          # Query Alpaca's news endpoint (sorted newest first, limit to 10)
          url = "https://data.alpaca.markets/v1beta1/news?sort=desc&limit=10"

          print("🔍 Fetching latest Alpaca financial news...")
          response = requests.get(url, headers=headers)

          if response.status_code != 200:
              print(f"❌ Failed to fetch news: {response.status_code} - {response.text}")
              exit(1)

          data = response.json()
          articles = data.get("news", [])

          seen = []
          if os.path.exists(STATE_FILE):
              try:
                  with open(STATE_FILE, "r") as f:
                      seen = json.load(f)
              except Exception:
                  seen = []

          new_seen = list(seen)
          new_count = 0

          for article in reversed(articles):
              article_id = str(article.get("id"))
              if not article_id:
                  continue

              if article_id not in seen:
                  headline = article.get("headline", "Financial News Update")
                  summary = article.get("summary", "")
                  article_url = article.get("url", "")
                  symbols = ", ".join(article.get("symbols", []))

                  if len(summary) > 250:
                      summary = summary[:247] + "..."

                  print(f"📈 New article found: {headline} ({symbols})")

                  webhook = DiscordWebhook(url=webhook_url)
                  embed = DiscordEmbed(
                      title=headline,
                      description=summary,
                      url=article_url,
                      color=15158332 # Professional financial accent color
                  )
                  embed.set_author(name=f"📈 Alpaca News [{symbols}]" if symbols else "📈 Alpaca Financial News")
                  embed.set_footer(text="via GitHub Actions")
                  webhook.add_embed(embed)
                  webhook.execute()

                  new_seen.append(article_id)
                  new_count += 1

          if new_count == 0:
              print("ℹ️ Nothing new to report. All current news articles have already been posted.")
          else:
              print(f"✅ Successfully posted {new_count} new article(s) to Discord.")

          if len(new_seen) > 100:
              new_seen = new_seen[-100:]

          with open(STATE_FILE, "w") as f:
              json.dump(new_seen, f)
          EOF

      - name: Commit State to Background Branch
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update seen Alpaca news cache [skip ci]"
          branch: state-data
          create_branch: true
          file_pattern: "seen_alpaca_news.json"
