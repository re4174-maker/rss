name: Push GitHub Trending to Discord

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour on the hour
  workflow_dispatch:

jobs:
  send-trending:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to commit state files back to the repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Restore State from Background Branch
        run: |
          git fetch origin state-data || true
          git checkout origin/state-data -- *.json 2>/dev/null || true
          git reset # Unstage files so git status is clean for the script

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install feedparser discord-webhook beautifulsoup4

      - name: Run Trend Checker & Notifier
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<EOF
          import os
          import json
          import feedparser
          from bs4 import BeautifulSoup
          from discord_webhook import DiscordWebhook, DiscordEmbed

          STATE_FILE = "seen_repos.json"
          
          print("🔍 Fetching and checking GitHub Trending RSS feed...")

          seen = []
          if os.path.exists(STATE_FILE):
              try:
                  with open(STATE_FILE, "r") as f:
                      seen = json.load(f)
              except Exception:
                  seen = []

          feed_url = "https://mshibanami.github.io/GitHubTrendingRSS/daily/all.xml"
          feed = feedparser.parse(feed_url)
          webhook_url = os.environ['DISCORD_WEBHOOK_URL']

          new_seen = list(seen)
          new_repos_count = 0

          for entry in reversed(feed.entries[:15]):
              repo_id = entry.link
              
              if repo_id not in seen:
                  print(f"🔥 New trending repo found: {entry.title} ({repo_id})")
                  
                  soup = BeautifulSoup(entry.summary, "html.parser")
                  clean_desc = soup.get_text(separator=" ").strip()
                  if len(clean_desc) > 250:
                      clean_desc = clean_desc[:247] + "..."

                  webhook = DiscordWebhook(url=webhook_url)
                  embed = DiscordEmbed(
                      title=entry.title,
                      description=clean_desc,
                      url=entry.link,
                      color=5814783
                  )
                  embed.set_author(name="🔥 New GitHub Trending Repo!")
                  embed.set_footer(text="via GitHub Actions")
                  webhook.add_embed(embed)
                  webhook.execute()

                  new_seen.append(repo_id)
                  new_repos_count += 1

          if new_repos_count == 0:
              print("ℹ️ Nothing new to report. All top trending repos have already been logged.")
          else:
              print(f"✅ Successfully posted {new_repos_count} new trending repository/repositories to Discord.")

          if len(new_seen) > 50:
              new_seen = new_seen[-50:]

          with open(STATE_FILE, "w") as f:
              json.dump(new_seen, f)
          EOF

      - name: Commit State to Background Branch
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update seen trending repos cache [skip ci]"
          branch: state-data
          create_branch: true
          file_pattern: "*.json"
